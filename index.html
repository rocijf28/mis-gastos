<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis Gastos</title>
<link rel="stylesheet" href="styles.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1e2a1d">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mis Gastos">
</head>
<body>

<div class="shell">
  <header class="app-header">
    <div>
      <p class="eyebrow">Libro de gastos</p>
      <h1>Mis Gastos</h1>
    </div>
    <div class="header-actions">
      <button type="button" class="link-btn" id="logoutBtn">Salir</button>
    </div>
  </header>

  <nav class="nav-bar" role="navigation" aria-label="Navegación de la app">
    <a class="nav-link" data-page="registrar" href="index.html">Registrar</a>
    <a class="nav-link" data-page="movimientos" href="movimientos.html">Movimientos</a>
    <a class="nav-link" data-page="fijos" href="gastos-fijos.html">Gastos fijos</a>
    <a class="nav-link" data-page="ingresos-fijos" href="ingresos-fijos.html">Ingresos fijos</a>
    <a class="nav-link" data-page="resumen" href="resumen.html">Resumen</a>
  </nav>

  <div class="modal-overlay" id="dineroInicialModal" hidden>
    <div class="modal-card">
      <h2 id="dineroInicialTitulo">¿De cuánto partes?</h2>
      <p class="modal-copy" id="dineroInicialCopy">Antes de empezar, dinos cuánto dinero tienes ahora mismo ahorrado. Así el "Saldo total" será correcto desde el primer día.</p>
      <div class="amount-row">
        <span class="currency">€</span>
        <input type="number" inputmode="decimal" step="0.01" min="0" id="dineroInicialInput" placeholder="0,00" aria-label="Dinero inicial en euros" />
      </div>
      <p class="form-error" id="dineroInicialError"></p>
      <div class="modal-actions">
        <button class="submit-btn" id="dineroInicialSaveBtn" type="button">Empezar</button>
        <button class="link-btn" id="dineroInicialCancelBtn" type="button" hidden>Cancelar</button>
      </div>
    </div>
  </div>

  <section class="card" id="formCard">
    <div class="type-toggle" role="group" aria-label="Tipo de movimiento">
      <button type="button" class="type-btn gasto" id="tipoGastoBtn" aria-pressed="true">Gasto</button>
      <button type="button" class="type-btn ingreso" id="tipoIngresoBtn" aria-pressed="false">Ingreso</button>
    </div>

    <div class="cat-grid" id="catGrid" role="group" aria-label="Categoría del gasto"></div>

    <div class="amount-row">
      <span class="currency">€</span>
      <input type="number" inputmode="decimal" step="0.01" min="0" id="amountInput" placeholder="0,00" aria-label="Importe en euros" />
    </div>

    <div class="two-col" id="dateMethodRow">
      <div class="field">
        <label for="dateInput">Fecha</label>
        <input type="date" id="dateInput" />
      </div>
      <div class="field" id="methodField">
        <label for="methodInput">Método de pago</label>
        <select id="methodInput"></select>
      </div>
    </div>

    <div class="field">
      <label for="noteInput" id="noteLabel">Nota (opcional)</label>
      <input type="text" id="noteInput" placeholder="Ej. cena con Marta" maxlength="120" />
    </div>

    <p class="form-error" id="formError"></p>
    <button class="submit-btn" id="submitBtn" type="button">Añadir gasto</button>
  </section>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script src="data.js"></script>
<script>
var PAGINA_ACTUAL = 'registrar';
(function () {
  'use strict';

  var selectedCategory = null;
  var tipo = 'gasto';

  var tipoGastoBtn = document.getElementById('tipoGastoBtn');
  var tipoIngresoBtn = document.getElementById('tipoIngresoBtn');
  var catGrid = document.getElementById('catGrid');
  var amountInput = document.getElementById('amountInput');
  var dateInput = document.getElementById('dateInput');
  var dateMethodRow = document.getElementById('dateMethodRow');
  var methodField = document.getElementById('methodField');
  var methodInput = document.getElementById('methodInput');
  var noteLabel = document.getElementById('noteLabel');
  var noteInput = document.getElementById('noteInput');
  var formError = document.getElementById('formError');
  var submitBtn = document.getElementById('submitBtn');

  poblarSelectMetodos(methodInput);

  function setTipo(nuevoTipo) {
    tipo = nuevoTipo;
    var esIngreso = tipo === 'ingreso';

    tipoGastoBtn.setAttribute('aria-pressed', String(!esIngreso));
    tipoIngresoBtn.setAttribute('aria-pressed', String(esIngreso));

    catGrid.hidden = esIngreso;
    methodField.hidden = esIngreso;
    dateMethodRow.classList.toggle('single-col', esIngreso);

    noteLabel.textContent = esIngreso ? 'Concepto' : 'Nota (opcional)';
    noteInput.placeholder = esIngreso ? 'Ej. Bizum de Ana' : 'Ej. cena con Marta';

    submitBtn.textContent = esIngreso ? 'Añadir ingreso' : 'Añadir gasto';
    submitBtn.classList.toggle('is-income', esIngreso);

    formError.textContent = '';
  }

  tipoGastoBtn.addEventListener('click', function () { setTipo('gasto'); });
  tipoIngresoBtn.addEventListener('click', function () { setTipo('ingreso'); });

  CATEGORIES.forEach(function (cat) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'cat-chip';
    btn.setAttribute('aria-pressed', 'false');
    btn.style.setProperty('--cat-color', 'var(' + cat.varName + ')');
    btn.innerHTML = '<span class="cat-dot"></span>' + cat.id;
    btn.addEventListener('click', function () {
      selectedCategory = cat.id;
      Array.prototype.forEach.call(catGrid.children, function (c) {
        c.setAttribute('aria-pressed', String(c === btn));
      });
      formError.textContent = '';
    });
    catGrid.appendChild(btn);
  });

  dateInput.value = hoyISO();

  submitBtn.addEventListener('click', function () {
    var esIngreso = tipo === 'ingreso';
    var importe = parseFloat(amountInput.value);
    var concepto = noteInput.value.trim();

    if (!esIngreso && !selectedCategory) {
      formError.textContent = 'Elige una categoría.';
      return;
    }
    if (esIngreso && !concepto) {
      formError.textContent = 'Escribe un concepto (ej. Bizum de Ana).';
      return;
    }
    if (!importe || importe <= 0) {
      formError.textContent = 'Escribe un importe válido.';
      return;
    }
    formError.textContent = '';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Añadiendo…';

    var promesa = esIngreso
      ? addIngreso({ fecha: dateInput.value, importe: importe, concepto: concepto })
      : addGasto({ fecha: dateInput.value, categoria: selectedCategory, importe: importe, metodoPago: methodInput.value, nota: concepto });

    promesa
      .then(function () {
        showToast((esIngreso ? 'Ingreso añadido: ' : 'Gasto añadido: ') + eur(importe));
        amountInput.value = '';
        noteInput.value = '';
      })
      .catch(function (err) {
        showToast(err.message || 'No se pudo guardar. Inténtalo de nuevo.');
      })
      .then(function () {
        submitBtn.disabled = false;
        submitBtn.textContent = esIngreso ? 'Añadir ingreso' : 'Añadir gasto';
      });
  });

  function cargarResumen() {
    getPerfil()
      .then(function (perfil) {
        if (perfil.dinero_inicial === null || typeof perfil.dinero_inicial === 'undefined') {
          mostrarDineroInicialModal(true);
        }
      })
      .catch(function () {
        showToast('No se pudo cargar el perfil.');
      });
  }

  exigirSesion().then(function () {
    initNav();
    initDineroInicialModal(function () { cargarResumen(); });
    cargarResumen();
  });
})();
</script>
</body>
</html>
